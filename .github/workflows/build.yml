name: Build and host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sticks3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Run host tests
        run: |
          for test in projects/pocket-radio/tests/*_test.cpp; do
            executable="${RUNNER_TEMP}/$(basename "${test}" .cpp)"
            c++ -std=c++11 -Wall -Wextra -I projects/pocket-radio/include "${test}" -o "${executable}"
            "${executable}"
          done
      - name: Build StickS3 firmware without secrets
        run: python -m platformio run -d projects/pocket-radio
